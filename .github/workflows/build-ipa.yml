name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SandboxFilza.xcodeproj \
            -target SandboxFilza \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Optional signed build: add repo secrets P12_B64, P12_PASSWORD,
      # MOBILEPROVISION_B64 and set TEAM_ID, then the steps below run.
      - name: Import signing material
        id: sign
        if: ${{ env.HAS_SECRETS == 'yes' }}
        env:
          P12_B64: ${{ secrets.P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_B64: ${{ secrets.MOBILEPROVISION_B64 }}
        run: |
          echo "$P12_B64" | base64 --decode > signing.p12
          echo "$MOBILEPROVISION_B64" | base64 --decode > signing.mobileprovision
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import signing.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp signing.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "HAS_SECRETS=yes" >> "$GITHUB_ENV"

      - name: Sign (optional)
        if: ${{ env.HAS_SECRETS == 'yes' }}
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          codesign --force --sign "Apple Development" \
            --entitlements SandboxFilza/SandboxFilza.entitlements \
            --generate-entitlement-der --timestamp=none \
            build/SandboxFilza.app
          codesign --verify --strict build/SandboxFilza.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/SandboxFilza.app Payload/
          zip -qry SandboxFilza.ipa Payload
          ls -lh SandboxFilza.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxFilza-ipa
          path: SandboxFilza.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Terminal Filza ${{ github.run_number }}
          body: |
            Unsigned build of SandboxFilza (worse_query sandbox-escape file browser).

            - Binary: arm64, MinOS 15.0
            - Sign lại trước khi cài (Feather / Sideloadly / AltStore / TrollStore)
          files: SandboxFilza.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
